<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070b18" />
    <meta
      name="description"
      content="Astral Zero - a fast-paced 2D arena platformer-shooter where a space janitor cleans low-Earth orbit junk."
    />
    <title>Astral Zero</title>

    <!-- Inline SVG favicon: avoids a 404 for /favicon.ico before real art exists. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23070b18'/><ellipse cx='16' cy='16' rx='11' ry='11' fill='none' stroke='%235ad8ff' stroke-width='2.5' stroke-dasharray='52 18' transform='rotate(-28 16 16)'/><circle cx='16' cy='16' r='3' fill='%23ffc247'/></svg>"
    />

    <style>
      /* Full-viewport space background so the letterboxed canvas blends in. */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #070b18;
        overflow: hidden;
        font-family: 'Trebuchet MS', 'Segoe UI', system-ui, -apple-system, sans-serif;
        /* Respect the notch / rounded corners on phones. */
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
        /* Stop iOS rubber-banding the page while the game is fullscreen. */
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }

      /* Phaser injects its canvas here; centre it both axes. */
      #game-root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #game-root canvas {
        display: block;
        image-rendering: auto;
        /* The canvas owns all gameplay input; never let the browser pan/zoom
           the page in response to a swipe or a double-tap. */
        touch-action: none;
      }

      /*
        Boot screen container.
        Its visible contents are built by src/ui/boot/BootScreen.js so the
        progress bar, the step labels and the ARIA attributes all live next to
        the state machine that drives them. The empty shell below is only the
        full-bleed container; `pointer-events: none` means it can never eat a
        click meant for the canvas, and the JS opts back in for the retry
        button when a connection actually fails.
      */
      #boot-status {
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <!-- The game canvas is rendered into this element by Phaser 3. -->
    <div id="game-root"></div>

    <!--
      Boot / loading screen. Populated by BootScreen (src/ui/boot/BootScreen.js)
      and driven by real boot milestones — no simulated progress.
    -->
    <div id="boot-status" role="region" aria-label="Astral Zero loading"></div>

    <!--
      ES module entry point. Vite resolves the bare "phaser" specifier and
      bundles the engine for both `npm run dev` and `npm run build`.
    -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
